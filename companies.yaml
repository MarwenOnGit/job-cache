# Target companies for the harvester.
# Each entry: name, ats_type (greenhouse|lever|ashby|smartrecruiters|workable|workday), ats_slug, hq_city, is_startup
# ats_slug is the company's identifier on that ATS (the {slug} in the board URL).
# Weighted toward Paris startups (best interview + visa odds). Easy to grow — add one line.
# Entries that stop resolving are skipped at harvest time and reported in the errors summary.
#
# Two kinds of sources:
#   companies:  curated single-company ATS boards (one slug == one employer).
#   sources:    keyless aggregators (Remotive, Arbeitnow, Jobicy, Himalayas, RemoteOK,
#               The Muse) — each fans out to hundreds of employers in one call. This is
#               the fast way to widen the search; the per-company list gives depth on
#               the employers you specifically care about.

