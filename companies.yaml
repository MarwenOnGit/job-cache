# ============================================================================
# Keyless aggregator sources. Each one call returns postings from MANY employers.
# The harvester enriches + filters them exactly like company jobs (location must be
# in your search preferences, role must map to a target family). Tune params to bias
# toward Europe. Comment any out you don't want.
# ============================================================================
sources:
  # Remotive — broad remote board. Pull the software + data categories.
  - { name: "Remotive (Software)", ats_type: remotive, aggregator: true, category: software-dev, limit: 200 }
  - { name: "Remotive (Data)",     ats_type: remotive, aggregator: true, category: data,         limit: 100 }

  # Arbeitnow — German/EU board, skews strongly European. Walk a few pages.
  - { name: "Arbeitnow (EU)",      ats_type: arbeitnow, aggregator: true, pages: 8 }

  # Jobicy — remote board with a geo filter; keep it to Europe.
  - { name: "Jobicy (Europe)",     ats_type: jobicy, aggregator: true, geo: europe, count: 50 }

  # Himalayas — remote board; many EU-eligible / worldwide roles.
  - { name: "Himalayas",           ats_type: himalayas, aggregator: true, limit: 50, pages: 4 }

  # RemoteOK — broad remote board (worldwide-eligible roles are kept).
  - { name: "RemoteOK",            ats_type: remoteok, aggregator: true }

  # The Muse — general board; bias to European hubs + engineering categories.
  - { name: "The Muse (London)",   ats_type: themuse, aggregator: true, pages: 3, location: "London, United Kingdom", category: ["Software Engineering", "Data Science", "Data and Analytics"] }
  - { name: "The Muse (Paris)",    ats_type: themuse, aggregator: true, pages: 3, location: "Paris, France",          category: ["Software Engineering", "Data Science", "Data and Analytics"] }
