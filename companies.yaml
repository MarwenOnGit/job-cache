# Target companies for the harvester — tuned for an OFFENSIVE-SECURITY / red-team
# job hunt (PFE internships + junior roles), open to Europe, North America and remote.
#
# Each entry: name, ats_type (greenhouse|lever|ashby|smartrecruiters|workable|workday), ats_slug, hq_city, is_startup
# ats_slug is the company's identifier on that ATS (the {slug} in the board URL).
# Entries that stop resolving are skipped at harvest time and reported in the errors
# summary — slugs below are best-effort, so prune anything that shows up as an error.
#
# Two kinds of sources:
#   companies:  curated single-company ATS boards (one slug == one employer). Weighted
#               toward security vendors and consultancies that hire pentesters / red
#               teamers / AppSec / cloud-security engineers and run internship programs.
#   sources:    keyless aggregators (Remotive, Arbeitnow, Jobicy, Himalayas, RemoteOK,
#               The Muse) tuned with security search terms — each fans out to hundreds
#               of employers in one call. Role filtering (offensive_security, appsec,
#               blue_team, cloud_grc, security_other) happens in the harvester, so even
#               broad boards only keep security roles.

companies:
  # ---------------- Security vendors / product security (Greenhouse) ----------------
  - { name: "Cloudflare",       ats_type: greenhouse,      ats_slug: cloudflare,     hq_city: London,     is_startup: false }
  - { name: "GitLab",           ats_type: greenhouse,      ats_slug: gitlab,         hq_city: Remote,     is_startup: false }
  - { name: "Datadog",          ats_type: greenhouse,      ats_slug: datadog,        hq_city: Paris,      is_startup: false }
  - { name: "Elastic",          ats_type: greenhouse,      ats_slug: elastic,        hq_city: Remote,     is_startup: false }
  - { name: "Snyk",             ats_type: greenhouse,      ats_slug: snyk,           hq_city: London,     is_startup: true }
  - { name: "HackerOne",        ats_type: greenhouse,      ats_slug: hackerone,      hq_city: Remote,     is_startup: true }
  - { name: "Sysdig",           ats_type: greenhouse,      ats_slug: sysdig,         hq_city: Remote,     is_startup: true }
  - { name: "Semgrep",          ats_type: greenhouse,      ats_slug: semgrep,        hq_city: Remote,     is_startup: true }
  - { name: "Chainguard",       ats_type: greenhouse,      ats_slug: chainguard,     hq_city: Remote,     is_startup: true }
  - { name: "Sonar (SonarSource)", ats_type: lever,        ats_slug: sonarsource,    hq_city: Geneva,     is_startup: true }
  - { name: "Proton",           ats_type: greenhouse,      ats_slug: proton,         hq_city: Geneva,     is_startup: true }
  - { name: "1Password",        ats_type: lever,           ats_slug: 1password,      hq_city: Remote,     is_startup: false }
  - { name: "Doppler",          ats_type: ashby,           ats_slug: doppler,        hq_city: Remote,     is_startup: true }
  - { name: "Wiz",              ats_type: greenhouse,      ats_slug: wiz,            hq_city: Remote,     is_startup: true }
  - { name: "Aqua Security",    ats_type: greenhouse,      ats_slug: aquasecurity,   hq_city: Remote,     is_startup: true }

  # ---------------- Offensive-security consultancies / pentest firms ----------------
  - { name: "Synack",           ats_type: greenhouse,      ats_slug: synack,         hq_city: Remote,     is_startup: true }
  - { name: "Bishop Fox",       ats_type: greenhouse,      ats_slug: bishopfox,      hq_city: Remote,     is_startup: true }
  - { name: "SpecterOps",       ats_type: greenhouse,      ats_slug: specterops,     hq_city: Remote,     is_startup: true }
  - { name: "Trail of Bits",    ats_type: lever,           ats_slug: trailofbits,    hq_city: Remote,     is_startup: true }
  - { name: "NCC Group",        ats_type: workday,         ats_slug: "nccgroup.wd3.myworkdayjobs.com|nccgroup|NCC_Group_External_Careers", hq_city: London, is_startup: false }
  - { name: "Praetorian",       ats_type: greenhouse,      ats_slug: praetorian,     hq_city: Remote,     is_startup: true }
  - { name: "Include Security", ats_type: greenhouse,      ats_slug: includesecurity, hq_city: Remote,    is_startup: true }
  - { name: "Doyensec",         ats_type: greenhouse,      ats_slug: doyensec,       hq_city: Remote,     is_startup: true }

  # ---------------- Big tech with strong security orgs (EU offices) ----------------
  - { name: "Stripe",           ats_type: greenhouse,      ats_slug: stripe,         hq_city: London,     is_startup: false }
  - { name: "Databricks",       ats_type: greenhouse,      ats_slug: databricks,     hq_city: London,     is_startup: false }
  - { name: "Figma",            ats_type: greenhouse,      ats_slug: figma,          hq_city: London,     is_startup: false }
  - { name: "Wise",             ats_type: smartrecruiters, ats_slug: Wise,           hq_city: London,     is_startup: false }
  - { name: "Nexthink",         ats_type: smartrecruiters, ats_slug: Nexthink,       hq_city: Geneva,     is_startup: true }

sources:
  # Remotive — free-text security searches (no dedicated security category).
  - { name: "Remotive (Security)",   ats_type: remotive, aggregator: true, search: security,             limit: 200 }
  - { name: "Remotive (Pentest)",    ats_type: remotive, aggregator: true, search: "penetration testing", limit: 100 }
  - { name: "Remotive (SecOps)",     ats_type: remotive, aggregator: true, search: "security engineer",   limit: 100 }

  # Arbeitnow — German/EU board; role filtering keeps only security roles.
  - { name: "Arbeitnow (EU)",        ats_type: arbeitnow, aggregator: true, pages: 8 }

  # Jobicy — remote board; tag-search on security terms.
  - { name: "Jobicy (Security)",     ats_type: jobicy, aggregator: true, tag: security,     count: 50 }
  - { name: "Jobicy (Cybersecurity)",ats_type: jobicy, aggregator: true, tag: cybersecurity, count: 50 }

  # Himalayas — remote board; many EU-eligible / worldwide roles (filtered to security).
  - { name: "Himalayas",             ats_type: himalayas, aggregator: true, limit: 50, pages: 4 }

  # RemoteOK — broad remote board (worldwide-eligible security roles are kept).
  - { name: "RemoteOK",              ats_type: remoteok, aggregator: true }

  # The Muse — general board; IT/engineering categories, filtered to security roles.
  - { name: "The Muse (London)",     ats_type: themuse, aggregator: true, pages: 3, location: "London, United Kingdom", category: ["Computer and IT", "Software Engineering"] }
  - { name: "The Muse (Remote)",     ats_type: themuse, aggregator: true, pages: 3, category: ["Computer and IT", "Software Engineering"] }
